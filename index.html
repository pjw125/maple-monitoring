<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="google-site-verification" content="j3B0Z9KoTmnRbMHq3N_KpFgCT4KBUPgtuObNeIbRS-Y" />

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6983109053543386" crossorigin="anonymous"></script>
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-PD2NXJ2R"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>메이플 모니터 (메니터) | 메이플스토리 캐릭터 활동성, 경험치 추적, 자산 관리 및 보스 스케줄러</title>
    <meta name="description" content="메이플 모니터(메니터) - 메이플스토리 캐릭터 활동성 모니터링, 7일 누적 경험치 추적, 달력형 아이템 및 메소 자산 기록, 보스 파티 일정 타임테이블 관리 통합 솔루션">
    <meta name="robots" content="index, follow">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-sub-bg: #111827;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --active-color: #10b981;
            --boss-color: #ec4899;
            --inactive-color: #f59e0b;
            --link-gold: #fbbf24;
            --input-bg: #0f172a;
            --popup-bg: #1e293b;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 15px;
        }

        .container { max-width: 1100px; margin: 0 auto; }
        
        .search-box {
            background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color);
            display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center;
        }
        input, select {
            padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);
            background: #0f172a; color: white; font-size: 15px; outline: none;
        }
        input[type="time"] { color-scheme: dark; }
        input:focus, select:focus { border-color: var(--accent-color); }
        input { flex: 1; min-width: 160px; }
        select { cursor: pointer; min-width: 130px; }
        
        button {
            padding: 12px 20px; background: var(--accent-color); color: #0f172a;
            font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }

        .btn-create-group { background: #10b981; color: #0f172a; }
        .btn-refresh-all { background: #8b5cf6; color: white; font-size: 13px; padding: 8px 14px; white-space: nowrap; }
        .btn-refresh-all:disabled { background: #475569 !important; color: #94a3b8 !important; cursor: not-allowed; opacity: 0.7; }

        .top-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; }

        .main-nav-tabs {
            display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 12px; flex-wrap: wrap;
        }
        .main-tab-btn {
            padding: 10px 22px; border-radius: 8px; background: var(--card-bg); color: var(--text-muted);
            border: 1px solid var(--border-color); cursor: pointer; font-size: 15px; font-weight: bold;
        }
        .main-tab-btn.active { background: var(--accent-color); color: #0f172a; border-color: var(--accent-color); }

        .group-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; flex: 1; }
        .tab-btn {
            padding: 8px 18px; border-radius: 20px; background: #1e293b; color: var(--text-muted);
            border: 1px solid var(--border-color); cursor: pointer; font-size: 14px; font-weight: bold; white-space: nowrap;
        }
        .tab-btn.active { background: var(--accent-color); color: #0f172a; border-color: var(--accent-color); }

        .asset-tab-pane { display: none; }
        .asset-tab-pane.active { display: block; }
        
        .asset-section-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px;
        }

        /* 캘린더 스타일 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 18px; font-weight: bold; }
        .calendar-header button { background: #334155; color: white; padding: 6px 14px; font-size: 14px; border-radius: 6px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .calendar-day-name { text-align: center; font-weight: bold; font-size: 13px; color: var(--text-muted); padding: 6px 0; }
        .calendar-cell {
            background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; min-height: 110px; padding: 6px;
            display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; position: relative;
        }
        .calendar-cell.empty { background: rgba(15, 23, 42, 0.3); border-color: transparent; cursor: default; }
        .calendar-cell.today-cell { border: 2px solid #f59e0b; }
        .cell-header { display: flex; justify-content: space-between; align-items: center; }
        .cell-date { font-size: 12px; font-weight: bold; color: var(--text-muted); }
        .today-badge-text { font-size: 9px; background: #f59e0b; color: #0f172a; padding: 1px 4px; border-radius: 3px; font-weight: bold; }
        
        .cell-content { font-size: 11px; display: flex; flex-direction: column; gap: 2px; margin-top: 4px; overflow: hidden; }
        .cell-badge {
            padding: 2px 4px; border-radius: 4px; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500;
            display: flex; justify-content: space-between; align-items: center;
        }
        .cell-badge button { background: transparent; border: none; color: inherit; font-size: 9px; cursor: pointer; padding: 0; margin-left: 3px; opacity: 0.7; }

        .day-popup-box {
            position: absolute; background: #0f172a; border: 2px solid var(--accent-color); border-radius: 10px; padding: 14px; width: 280px; z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7); display: none;
        }
        .day-popup-box.active { display: block; }
        .popup-header { font-size: 13px; font-weight: bold; color: var(--accent-color); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .popup-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
        .popup-chip { background: #334155; color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; border: none; cursor: pointer; }
        .popup-form { display: flex; flex-direction: column; gap: 6px; }
        .popup-form input { padding: 8px; font-size: 13px; background: #1e293b; }

        .stats-summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 20px; }
        .stat-card { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; }
        .stat-card-title { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }

        /* ⚔️ 보스 파티 타임라인 스타일 */
        .timetable-panel { background: var(--card-sub-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; }
        .timetable-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .week-nav-controls { display: flex; align-items: center; gap: 6px; }
        .week-nav-controls button { background: #334155; color: white; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
        
        .timetable-days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: stretch; }
        @media (max-width: 900px) {
            .timetable-days-grid { grid-template-columns: 1fr; }
        }
        .day-column {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
        }
        .day-column-header {
            background: #0f172a; border-bottom: 1px solid var(--border-color); padding: 10px 8px;
            display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; color: var(--text-muted); flex-shrink: 0;
        }
        .day-column.today .day-column-header { background: rgba(56, 189, 248, 0.2); color: var(--accent-color); border-bottom-color: var(--accent-color); }
        .day-column-header button {
            background: var(--accent-color); color: #0f172a; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: bold; cursor: pointer; border: none;
        }

        .day-timeline-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; flex: 1; }

        .timeline-slot-row {
            height: 48px;
            min-height: 48px;
            max-height: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .timeline-empty-slot {
            height: 100%;
            border: 1px dashed rgba(255,255,255,0.03);
            border-radius: 6px;
        }

        .timetable-event-card {
            background: #0f172a; border-radius: 8px; padding: 7px 9px; font-size: 11px; height: 42px; box-sizing: border-box;
            border-left: 5px solid var(--accent-color); border-top: 1px solid rgba(255,255,255,0.1);
            border-right: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); cursor: grab; transition: transform 0.1s, filter 0.15s; flex-shrink: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative;
        }
        .timetable-event-card:active { cursor: grabbing; }
        .timetable-event-card:hover { transform: translateY(-1px); filter: brightness(1.15); }
        .timetable-event-card.selected { border: 2px solid var(--accent-color); background: #172554; }
        
        /* ⏰ 시간이 지나면 자동으로 회색 처리 (드래그해서 옮기면 원래 색상으로 부활) */
        .timetable-event-card.past-boss {
            opacity: 0.35;
            filter: grayscale(100%);
            border-left-color: #64748b !important;
        }

        .timetable-bottom-details {
            margin-top: 15px;
            background: #0b1120;
            border: 1px solid var(--accent-color);
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 13px;
            color: var(--text-color);
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .timetable-bottom-details.active { display: block; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6);
            display: flex; justify-content: center; align-items: center; z-index: 9999; display: none;
        }
        .modal-overlay.active { display: flex; }
        .schedule-modal-box {
            background: var(--popup-bg); border: 2px solid var(--accent-color); border-radius: 16px; padding: 22px; width: 340px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 10px;
        }

        .quick-chips-box { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
        .quick-chip-item {
            background: #334155; color: white; font-size: 11px; padding: 3px 8px; border-radius: 6px; cursor: pointer; border: none; font-weight: 500;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .quick-chip-item:hover { background: var(--accent-color); color: #0f172a; }
        .quick-chip-delete { font-size: 9px; opacity: 0.7; border-radius: 50%; padding: 0 3px; }
        .quick-chip-delete:hover { opacity: 1; background: #ef4444; color: white; }

        #cardContainer { display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; position: relative; }
        .btn-delete-top {
            position: absolute; top: 20px; right: 20px; background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .profile-header { display: flex; align-items: center; gap: 20px; padding-right: 60px; }
        .char-img { 
            width: 130px; height: 130px; background: linear-gradient(135deg, #0f172a, #334155); 
            border: 2px solid var(--border-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden;
        }
        .char-img img { width: 140%; height: 140%; object-fit: contain; transform: scale(1.4); }
        .badge { display: inline-block; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 6px; }

        .badge-psycho { background: rgba(239, 68, 68, 0.25); color: #f87171; } 
        .badge-hardcore { background: rgba(245, 158, 11, 0.25); color: #fbbf24; } 
        .badge-step85 { background: rgba(168, 85, 247, 0.2); color: #c084fc; }  
        .badge-step75 { background: rgba(14, 165, 233, 0.2); color: #38bdf8; }   
        .badge-step65 { background: rgba(16, 185, 129, 0.2); color: #34d399; }   
        .badge-step50 { background: rgba(251, 146, 60, 0.2); color: #fdba74; }   
        .badge-step35 { background: rgba(236, 72, 153, 0.2); color: #f472b6; }   
        .badge-step30 { background: rgba(217, 70, 239, 0.2); color: #e879f9; }   
        .badge-monthly { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }
        .badge-boss { background: rgba(236, 72, 153, 0.2); color: #ec4899; }
        .badge-inactive { background: rgba(100, 116, 139, 0.25); color: #64748b; }

        .group-select-inline {
            background: #0284c7; color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-left: 6px; cursor: pointer;
        }
        .summary-box {
            margin-top: 15px; background: #111827; padding: 12px 14px; border-radius: 8px; font-size: 13px; color: var(--text-muted); line-height: 1.5;
            display: flex; flex-direction: column; gap: 6px;
        }
        .category-tag {
            display: inline-block; background: #334155; color: #38bdf8; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; margin-bottom: 4px;
        }
        .summary-footer {
            display: flex; justify-content: space-between; font-size: 11px; color: #64748b; border-top: 1px solid #1e293b; padding-top: 6px; margin-top: 2px;
        }
        #loading { display: none; text-align: center; color: var(--accent-color); font-weight: bold; padding: 15px; }
        footer {
            margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--border-color); text-align: center; font-size: 13px; color: var(--text-muted); line-height: 1.8;
        }
        footer a { color: var(--link-gold); text-decoration: none; font-weight: 500; }
        .footer-links { margin-top: 6px; }
        .footer-links span { margin: 0 4px; color: #64748b; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h2>👥 메이플스토리 캐릭터 활동 모니터</h2>
    
    <div class="main-nav-tabs">
        <button class="main-tab-btn active" id="navBtnMonitor" onclick="switchMainTab('monitor')">👥 캐릭터 활동 모니터</button>
        <button class="main-tab-btn" id="navBtnAsset" onclick="switchMainTab('asset')">📅 달력형 자산·아이템 스케줄러</button>
        <button class="main-tab-btn" id="navBtnBoss" onclick="switchMainTab('boss')">⚔️ 보스 파티 스케줄</button>
    </div>

    <!-- 1️⃣ [캐릭터 활동 모니터] 화면 탭 -->
    <div class="asset-tab-pane active" id="paneMonitor">
        <div class="search-box">
            <input type="text" id="charName" placeholder="캐릭터 닉네임 입력" onkeypress="if(event.key==='Enter') addOrUpdateCharacter()">
            <select id="groupSelect"></select>
            <button class="btn-create-group" onclick="createNewGroup()">+ 그룹 생성</button>
            <button onclick="addOrUpdateCharacter()">캐릭터 추가</button>
        </div>

        <div class="top-controls">
            <div class="group-tabs" id="groupTabs"></div>
            <button class="btn-refresh-all" id="btnRefreshAll" onclick="manualRefreshAllCharacters()">🔄 전체 갱신</button>
        </div>

        <div id="loading">캐릭터 데이터를 분석하여 진단 문장을 생성하는 중...</div>
        <div id="cardContainer"></div>
    </div>

    <!-- 2️⃣ [달력형 자산·아이템 스케줄러] 화면 탭 -->
    <div class="asset-tab-pane" id="paneAsset">
        <div class="asset-section-card">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">◀ 이전 달</button>
                <span id="calendarTitle">2026년 6월</span>
                <button onclick="changeMonth(1)">다음 달 ▶</button>
            </div>

            <div class="calendar-grid" style="margin-bottom: 6px;">
                <div class="calendar-day-name" style="color:#f87171;">일</div>
                <div class="calendar-day-name">월</div>
                <div class="calendar-day-name">화</div>
                <div class="calendar-day-name">수</div>
                <div class="calendar-day-name">목</div>
                <div class="calendar-day-name">금</div>
                <div class="calendar-day-name" style="color:#60a5fa;">토</div>
            </div>

            <div class="calendar-grid" id="calendarDaysGrid" style="position: relative;"></div>
            <div class="stats-summary-grid" id="statsSummaryGrid"></div>
        </div>
    </div>

    <!-- 3️⃣ [보스 파티 스케줄] 화면 탭 -->
    <div class="asset-tab-pane" id="paneBoss">
        <div class="asset-section-card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:15px;">
                <div>
                    <h3 style="margin: 0; color: var(--accent-color);">⚔️ 주간 보스 파티 타임라인</h3>
                </div>
            </div>

            <div class="timetable-panel">
                <div class="timetable-header">
                    <span style="font-weight:bold; font-size:14px;" id="currentWeekRangeLabel">📅 이번 주 타임라인</span>
                    <div class="week-nav-controls">
                        <button onclick="changeWeekOffset(-1)">◀ 이전 주</button>
                        <button onclick="resetWeekOffset()">이번 주</button>
                        <button onclick="changeWeekOffset(1)">다음 주 ▶</button>
                    </div>
                </div>

                <!-- 월~일 요일표 그리드 -->
                <div class="timetable-days-grid" id="timetableDaysGrid"></div>

                <!-- 카드 클릭 시 하단에 고정으로 표시되는 상세 내용 패널 -->
                <div class="timetable-bottom-details" id="timetableBottomDetails">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span id="bottomDetailTitle" style="font-weight:bold; color:var(--accent-color); font-size:15px;">📌 보스 상세 정보</span>
                        <button onclick="closeBottomDetails()" style="background:transparent; border:none; color:white; font-size:14px; cursor:pointer; padding:0;">✖ 닫기</button>
                    </div>
                    <div id="bottomDetailContent" style="display:flex; flex-direction:column; gap:4px; font-size:13px; margin-bottom:12px;"></div>
                    <div style="display:flex; justify-content:flex-end; gap:6px;" id="bottomDetailButtons"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 중앙 모달 등록 팝업창 -->
    <div class="modal-overlay" id="scheduleModalOverlay" onclick="closeScheduleModal()">
        <div class="schedule-modal-box" onclick="event.stopPropagation()">
            <div class="popup-header">
                <span id="modalTitleText" style="font-size:15px;">➕ 보스 일정 추가</span>
                <button onclick="closeScheduleModal()" style="background:transparent; border:none; color:white; font-size:16px; cursor:pointer;">✖</button>
            </div>
            <div class="popup-form">
                <input type="hidden" id="modalTargetDay" value="1">
                <input type="hidden" id="modalEditingId" value="">

                <label style="font-size:11px; color:var(--text-muted);">보스 이름</label>
                <input type="text" id="modalBossTitle" placeholder="예: 하드 칼로스">
                <div class="quick-chips-box" id="modalBossChips"></div>

                <label style="font-size:11px; color:var(--text-muted); margin-top:4px;">참여 캐릭터</label>
                <div style="display:flex; gap:6px;">
                    <input type="text" id="modalBossChar" placeholder="예: 캐릭A" style="flex:1;" oninput="syncModalColorWithChar(this.value)">
                    <div style="display:flex; align-items:center; gap:4px; font-size:11px; color:var(--text-muted);">
                        색상: <input type="color" id="modalCharColorPicker" value="#38bdf8" style="width:36px; height:36px; border:none; background:transparent; cursor:pointer;">
                    </div>
                </div>
                <div class="quick-chips-box" id="modalCharChips"></div>

                <label style="font-size:11px; color:var(--text-muted); margin-top:4px;">시작 시각 (30분 단위 선택)</label>
                <input type="time" id="modalBossTime" value="21:00" step="1800" oninput="checkModalTimeConflict()">
                <div id="modalConflictWarning" style="font-size:11px; color:#ef4444; font-weight:bold; display:none; margin-top:2px;">
                    ⚠️ 선택하신 요일에 이미 등록된 일정과 시간이 겹칩니다!
                </div>

                <label style="font-size:11px; color:var(--text-muted); margin-top:4px;">반복 유형</label>
                <select id="modalBossType">
                    <option value="고정">🛡️ 매주 고정 파티</option>
                    <option value="일회성">⚡ 이번 주만 일회성</option>
                </select>

                <label style="font-size:11px; color:var(--text-muted); margin-top:4px;">채널 (선택 사항)</label>
                <input type="text" id="modalBossChannel" placeholder="예: 5 또는 자유 채널">

                <label style="font-size:11px; color:var(--text-muted); margin-top:4px;">메모 / 파티원</label>
                <input type="text" id="modalBossMemo" placeholder="예: 비숍 1명 지원">

                <button onclick="submitModalSchedule()" style="background:#10b981; color:#0f172a; padding:10px; font-size:14px; margin-top:8px; font-weight:bold;">➕ 등록 완료</button>
            </div>
        </div>

        <div>메이플스토리 공식 서비스와 관련 없는 비공식 팬 도구입니다.</div>
        <div style="margin: 4px 0; color: #888; font-size: 0.9em;">Data based on NEXON Open API</div>

            <a href="about.html">사이트 소개</a>
            <span>·</span>
            <a href="terms.html">이용약관</a>
            <span>·</span>
            <a href="privacy.html">개인정보처리방침</a>
        </div>

</div>

<script>
const API_KEY = "live_2172c694670af1863be767e315e2fc1921cb3d1edab4a8f86476ca000762ebdfefe8d04e6d233bd35cf2fabdeb93fb0d";
let currentTab = '전체';
let currentDate = new Date();
let activePopupDate = null; 
let weekOffset = 0; 
let rememberedModalTime = "21:00"; 
let selectedCardId = null;

const colorPalette = [
    { bg: 'rgba(56, 189, 248, 0.25)', color: '#38bdf8' },
    { bg: 'rgba(16, 185, 129, 0.25)', color: '#34d399' },
    { bg: 'rgba(245, 158, 11, 0.25)', color: '#fbbf24' },
    { bg: 'rgba(236, 72, 153, 0.25)', color: '#ec4899' },
    { bg: 'rgba(168, 85, 247, 0.25)', color: '#c084fc' },
    { bg: 'rgba(239, 68, 68, 0.25)', color: '#f87171' }
];

function getItemColor(itemName) {
    let hash = 0;
    for (let i = 0; i < itemName.length; i++) hash = itemName.charCodeAt(i) + ((hash << 5) - hash);
    return colorPalette[Math.abs(hash) % colorPalette.length];
}

function getCharacterColors() {
    return JSON.parse(localStorage.getItem('maple_char_colors_v9') || '{}');
}

function setCharacterColor(charName, colorHex) {
    if (!charName) return;
    let colors = getCharacterColors();
    colors[charName.trim()] = colorHex;
    localStorage.setItem('maple_char_colors_v9', JSON.stringify(colors));
}

const defaultCharColors = [
    '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', 
    '#06b6d4', '#6366f1', '#65a30d', '#f43f5e', '#a855f7',
    '#e11d48', '#0284c7', '#16a34a', '#d97706', '#9333ea'
];

function getCharacterTheme(charName) {
    if (!charName) return '#38bdf8';
    let customColors = getCharacterColors();
    if (customColors[charName.trim()]) return customColors[charName.trim()];
    let hash = 0;
    for (let i = 0; i < charName.length; i++) hash = charName.charCodeAt(i) + ((hash << 5) - hash);
    return defaultCharColors[Math.abs(hash) % defaultCharColors.length];
}

function syncModalColorWithChar(charName) {
    if (!charName) return;
    let customColors = getCharacterColors();
    if (customColors[charName.trim()]) {
        document.getElementById('modalCharColorPicker').value = customColors[charName.trim()];
    } else {
        document.getElementById('modalCharColorPicker').value = getCharacterTheme(charName.trim());
    }
}

function switchMainTab(tabName) {
    const btnMonitor = document.getElementById('navBtnMonitor');
    const btnAsset = document.getElementById('navBtnAsset');
    const btnBoss = document.getElementById('navBtnBoss');
    const paneMonitor = document.getElementById('paneMonitor');
    const paneAsset = document.getElementById('paneAsset');
    const paneBoss = document.getElementById('paneBoss');

    btnMonitor.classList.remove('active');
    btnAsset.classList.remove('active');
    if(btnBoss) btnBoss.classList.remove('active');
    paneMonitor.classList.remove('active');
    paneAsset.classList.remove('active');
    if(paneBoss) paneBoss.classList.remove('active');

    if (tabName === 'monitor') {
        btnMonitor.classList.add('active');
        paneMonitor.classList.add('active');
    } else if (tabName === 'asset') {
        btnAsset.classList.add('active');
        paneAsset.classList.add('active');
        renderCalendar();
    } else if (tabName === 'boss') {
        if(btnBoss) btnBoss.classList.add('active');
        if(paneBoss) paneBoss.classList.add('active');
        renderBossDashboard();
    }
}

async function fetchApi(url) {
    try {
        const res = await fetch(url, { headers: { 'x-nxopen-api-key': API_KEY } });
        if (!res.ok) return null;
        return await res.json();
    } catch (e) {
        return null;
    }
}

function getDateStr(daysAgo) {
    const d = new Date();
    d.setDate(d.getDate() - daysAgo);
    return d.toISOString().split('T')[0];
}

window.onload = function() {
    let groups = getSavedGroups();
    if (groups.length === 0) {
        groups = ['친구'];
        saveGroups(groups);
    }
    updateGroupDropdown();
    renderGroupTabs();
    renderSavedCards();
    renderCalendar();
    renderBossDashboard();
    
    // 💡 1분마다 시간 체크하여 지나간 보스 회색 자동 갱신
    setInterval(() => {
        if (document.getElementById('paneBoss').classList.contains('active')) {
            renderBossDashboard();
        }
    }, 60000);
};

/* ⚔️ 보스 파티 타임라인 데이터 관리 */
function getBossSchedules() {
    return JSON.parse(localStorage.getItem('maple_boss_schedules_v22') || '[]');
}

function saveBossSchedules(list) {
    localStorage.setItem('maple_boss_schedules_v22', JSON.stringify(list));
}

function getBossHistory() {
    return JSON.parse(localStorage.getItem('maple_boss_history_v2') || '{"bosses": [], "chars": []}');
}

function saveBossHistory(history) {
    localStorage.setItem('maple_boss_history_v2', JSON.stringify(history));
}

function recordHistory(bossName, charName) {
    let history = getBossHistory();
    if (bossName && !history.bosses.includes(bossName)) history.bosses.push(bossName);
    if (charName && !history.chars.includes(charName)) history.chars.push(charName);
    saveBossHistory(history);
}

function removeHistoryItem(type, val, event) {
    event.stopPropagation();
    let history = getBossHistory();
    if (type === 'boss') history.bosses = history.bosses.filter(b => b !== val);
    else if (type === 'char') history.chars = history.chars.filter(c => c !== val);
    saveBossHistory(history);
    openScheduleModal(document.getElementById('modalTargetDay').value);
}

function openScheduleModal(dayIdx, defaultTime = null, editingId = null) {
    const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
    document.getElementById('modalTargetDay').value = dayIdx;
    
    const warningEl = document.getElementById('modalConflictWarning');
    if (warningEl) warningEl.style.display = 'none';

    if (editingId) {
        let list = getBossSchedules();
        let editingItem = list.find(ev => ev.id == editingId);
        if (editingItem) {
            document.getElementById('modalTitleText').textContent = `✍️ 보스 일정 수정`;
            document.getElementById('modalEditingId').value = editingItem.id;
            document.getElementById('modalBossTitle').value = editingItem.title;
            document.getElementById('modalBossChar').value = editingItem.character;
            document.getElementById('modalCharColorPicker').value = getCharacterTheme(editingItem.character);
            document.getElementById('modalBossTime').value = editingItem.time;
            document.getElementById('modalBossType').value = editingItem.type;
            document.getElementById('modalBossChannel').value = editingItem.channel ? editingItem.channel.replace('채널 ', '') : '';
            document.getElementById('modalBossMemo').value = editingItem.memo || '';
        }
    } else {
        document.getElementById('modalTitleText').textContent = `➕ ${dayNames[dayIdx]} 보스 일정 추가`;
        document.getElementById('modalEditingId').value = '';
        document.getElementById('modalBossTitle').value = '';
        if (defaultTime) rememberedModalTime = defaultTime;
        document.getElementById('modalBossTime').value = rememberedModalTime;
        document.getElementById('modalBossType').value = '고정';
        document.getElementById('modalBossChannel').value = '';
        document.getElementById('modalBossMemo').value = '';

        const history = getBossHistory();
        if (history.chars.length > 0) {
            let firstChar = history.chars[0];
            document.getElementById('modalBossChar').value = firstChar;
            document.getElementById('modalCharColorPicker').value = getCharacterTheme(firstChar);
        }
    }
    
    const history = getBossHistory();
    document.getElementById('modalBossChips').innerHTML = history.bosses.map(b => `<button type="button" class="quick-chip-item" onclick="document.getElementById('modalBossTitle').value='${b}'">${b}<span class="quick-chip-delete" onclick="removeHistoryItem('boss', '${b}', event)">✖</span></button>`).join('');
    document.getElementById('modalCharChips').innerHTML = history.chars.map(c => `<button type="button" class="quick-chip-item" onclick="document.getElementById('modalBossChar').value='${c}'; syncModalColorWithChar('${c}');">${c}<span class="quick-chip-delete" onclick="removeHistoryItem('char', '${c}', event)">✖</span></button>`).join('');

    document.getElementById('scheduleModalOverlay').classList.add('active');
    checkModalTimeConflict();
}

function closeScheduleModal() {
    document.getElementById('scheduleModalOverlay').classList.remove('active');
}

function checkModalTimeConflict() {
    const dayIdx = parseInt(document.getElementById('modalTargetDay').value, 10);
    const timeVal = document.getElementById('modalBossTime').value;
    const editingId = document.getElementById('modalEditingId').value;
    const warningEl = document.getElementById('modalConflictWarning');
    
    if (!warningEl || !timeVal) return;

    const list = getBossSchedules();
    const activeList = list.filter(item => {
        if (editingId && item.id == editingId) return false;
        if (item.type === '고정') return true;
        return (item.createdWeekOffset !== undefined ? item.createdWeekOffset : 0) === weekOffset;
    });

    const isConflict = activeList.some(ev => ev.day === dayIdx && ev.time === timeVal);
    warningEl.style.display = isConflict ? 'block' : 'none';
}

function submitModalSchedule() {
    const dayIdx = parseInt(document.getElementById('modalTargetDay').value, 10);
    const editingId = document.getElementById('modalEditingId').value;
    const title = document.getElementById('modalBossTitle').value.trim();
    const character = document.getElementById('modalBossChar').value.trim();
    const charColor = document.getElementById('modalCharColorPicker').value;
    const time = document.getElementById('modalBossTime').value;
    
    rememberedModalTime = time;
    const type = document.getElementById('modalBossType').value;
    
    let rawChannel = document.getElementById('modalBossChannel').value.trim();
    let channel = rawChannel ? (/^\d+$/.test(rawChannel) ? `채널 ${rawChannel}` : rawChannel) : '';
    const memo = document.getElementById('modalBossMemo').value.trim();

    if (!title) return alert('보스 이름을 입력해주세요!');
    if (!character) return alert('참여 캐릭터 이름을 입력해주세요!');

    let list = getBossSchedules();
    const activeList = list.filter(item => {
        if (editingId && item.id == editingId) return false;
        if (item.type === '고정') return true;
        return (item.createdWeekOffset !== undefined ? item.createdWeekOffset : 0) === weekOffset;
    });

    if (activeList.some(ev => ev.day === dayIdx && ev.time === time)) {
        alert('해당 요일의 동일한 시간대에 이미 다른 일정이 존재합니다.');
        return;
    }

    setCharacterColor(character, charColor);
    recordHistory(title, character);

    if (editingId) {
        let item = list.find(ev => ev.id == editingId);
        if (item) {
            item.title = title;
            item.character = character;
            item.type = type;
            item.day = dayIdx;
            item.time = time;
            item.channel = channel;
            item.memo = memo;
        }
    } else {
        list.push({
            id: Date.now(),
            title, character, type,
            day: dayIdx,
            time, channel, memo,
            createdWeekOffset: weekOffset
        });
    }

    saveBossSchedules(list);
    closeScheduleModal();
    renderBossDashboard();
}

function changeWeekOffset(offset) {
    weekOffset += offset;
    selectedCardId = null;
    renderBossDashboard();
}

function resetWeekOffset() {
    weekOffset = 0;
    selectedCardId = null;
    renderBossDashboard();
}

function handleDragStart(e, id) {
    e.dataTransfer.setData('text/plain', id);
}

function handleDragOver(e) {
    e.preventDefault();
}

function handleDrop(e, targetDayIdx) {
    e.preventDefault();
    const id = parseInt(e.dataTransfer.getData('text/plain'), 10);
    if (!id) return;

    let list = getBossSchedules();
    let item = list.find(ev => ev.id === id);
    if (!item) return;

    let slotRow = e.target.closest('.timeline-slot-row');
    if (!slotRow) return;

    let targetTime = slotRow.getAttribute('data-time');
    if (!targetTime) return;

    const activeList = list.filter(ev => ev.id !== id && (ev.type === '고정' || (ev.createdWeekOffset || 0) === weekOffset));
    if (activeList.some(ev => ev.day === targetDayIdx && ev.time === targetTime)) {
        alert('해당 요일의 동일한 시간대에 이미 다른 일정이 존재합니다.');
        return;
    }

    item.day = targetDayIdx;
    item.time = targetTime;
    saveBossSchedules(list);
    renderBossDashboard();
}

function handleCardClick(id, event) {
    event.stopPropagation();
    selectedCardId = id;
    renderBossDashboard();
}

function closeBottomDetails() {
    selectedCardId = null;
    renderBossDashboard();
}

function deleteBossSchedule(id, event) {
    event.stopPropagation();
    if (!confirm('이 파티 일정을 삭제하시겠습니까?')) return;
    let list = getBossSchedules().filter(item => item.id !== id);
    saveBossSchedules(list);
    if (selectedCardId === id) selectedCardId = null;
    renderBossDashboard();
}

/* 🕒 요일별 시간 라인 및 시간 도래 시 회색 처리 로직 (요일 옆 날짜 표기 추가) */
function renderBossDashboard() {
    const list = getBossSchedules();
    const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
    
    const realTodayDay = new Date().getDay();
    const now = new Date();
    const currentHH = String(now.getHours()).padStart(2, '0');
    const currentMM = String(now.getMinutes()).padStart(2, '0');
    const currentTimeStr = `${currentHH}:${currentMM}`;

    const activeList = list.filter(item => {
        if (item.type === '고정') return true;
        return (item.createdWeekOffset !== undefined ? item.createdWeekOffset : 0) === weekOffset;
    });

    let allTimesSet = new Set();
    activeList.forEach(ev => allTimesSet.add(ev.time));
    let sortedTimes = Array.from(allTimesSet).sort((a, b) => a.localeCompare(b));

    const targetWeek = new Date();
    targetWeek.setDate(targetWeek.getDate() + (weekOffset * 7));
    const currentDayOfWeek = targetWeek.getDay();
    const sunday = new Date(targetWeek);
    sunday.setDate(targetWeek.getDate() - currentDayOfWeek);
    const saturday = new Date(sunday);
    saturday.setDate(saturday.getDate() + 6);

    const formatDateStr = (d) => `${d.getMonth() + 1}.${String(d.getDate()).padStart(2, '0')}`;
    let weekLabel = weekOffset === 0 ? `📅 이번 주 타임라인 (${formatDateStr(sunday)} ~ ${formatDateStr(saturday)})` :
                    weekOffset > 0 ? `📅 +${weekOffset}주차 타임라인 (${formatDateStr(sunday)} ~ ${formatDateStr(saturday)})` :
                    `📅 ${weekOffset}주차 타임라인 (${formatDateStr(sunday)} ~ ${formatDateStr(saturday)})`;

    document.getElementById('currentWeekRangeLabel').textContent = weekLabel;

    const timetableGrid = document.getElementById('timetableDaysGrid');
    let gridHtml = '';

    for (let i = 1; i <= 7; i++) {
        const dayIdx = i % 7;
        const isToday = (weekOffset === 0 && dayIdx === realTodayDay);
        
        // 💡 요일별 정확한 날짜 계산 (일요일~토요일)
        const targetDayDate = new Date(sunday);
        targetDayDate.setDate(sunday.getDate() + dayIdx);
        const dateMonth = targetDayDate.getMonth() + 1;
        const dateDay = targetDayDate.getDate();
        const dateLabel = `${dateMonth}/${dateDay}`;

        let bodyItemsHtml = '';

        if (sortedTimes.length === 0) {
            bodyItemsHtml = `<div style="text-align:center; color:var(--text-muted); font-size:11px; padding:25px 0;">등록된 일정 없음</div>`;
        } else {
            sortedTimes.forEach(timeSlot => {
                const matchedEvent = activeList.find(ev => ev.day === dayIdx && ev.time === timeSlot);
                
                bodyItemsHtml += `<div class="timeline-slot-row" data-time="${timeSlot}">`;
                if (matchedEvent) {
                    const charColor = getCharacterTheme(matchedEvent.character);
                    const isSelected = selectedCardId === matchedEvent.id ? 'selected' : '';

                    let pastClass = '';
                    if (isToday) {
                        if (currentTimeStr >= matchedEvent.time) {
                            pastClass = 'past-boss';
                        }
                    } else if (weekOffset < 0 || (weekOffset === 0 && dayIdx < realTodayDay)) {
                        pastClass = 'past-boss';
                    }

                    bodyItemsHtml += `
                    <div class="timetable-event-card ${isSelected} ${pastClass}" draggable="true" ondragstart="handleDragStart(event, ${matchedEvent.id})" onclick="handleCardClick(${matchedEvent.id}, event)" title="${matchedEvent.title} / ${matchedEvent.character}">
                        <div style="display:flex; justify-content:space-between; align-items:center; pointer-events:none;">
                            <span style="font-weight:bold; color:var(--text-color); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${matchedEvent.title}</span>
                            <span style="font-size:10px; color:var(--accent-color); font-weight:bold; flex-shrink:0; margin-left:4px;">${matchedEvent.time}</span>
                        </div>
                        <div style="font-size:10px; color:${charColor}; font-weight:bold; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; pointer-events:none;">
                            👤 ${matchedEvent.character}
                        </div>
                    </div>
                    `;
                } else {
                    bodyItemsHtml += `<div class="timeline-empty-slot" ondragover="handleDragOver(event)" ondrop="handleDrop(event, ${dayIdx})"></div>`;
                }
                bodyItemsHtml += `</div>`;
            });
        }

        gridHtml += `
        <div class="day-column ${isToday ? 'today' : ''}">
            <div class="day-column-header">
                <span>${dayNames[dayIdx]}요일 <span style="font-size:11px; color:var(--accent-color); font-weight:normal;">(${dateLabel})</span></span>
                <button onclick="openScheduleModal(${dayIdx})">＋ 추가</button>
            </div>
            <div class="day-timeline-body" ondragover="handleDragOver(event)" ondrop="handleDrop(event, ${dayIdx})">
                ${bodyItemsHtml}
            </div>
        </div>
        `;
    }

    timetableGrid.innerHTML = gridHtml;

    const bottomDetailsEl = document.getElementById('timetableBottomDetails');
    const detailTitleEl = document.getElementById('bottomDetailTitle');
    const detailContentEl = document.getElementById('bottomDetailContent');
    const detailButtonsEl = document.getElementById('bottomDetailButtons');

    if (selectedCardId) {
        const selectedEvent = activeList.find(ev => ev.id === selectedCardId);
        if (selectedEvent) {
            const charColor = getCharacterTheme(selectedEvent.character);
            const isFixed = selectedEvent.type === '고정';

            detailTitleEl.textContent = `📌 [${dayNames[selectedEvent.day]}요일 ${selectedEvent.time}] ${selectedEvent.title}`;
            detailContentEl.innerHTML = `
                <div>⏰ 시각: <b>${selectedEvent.time}</b> (${dayNames[selectedEvent.day]}요일)</div>
                <div>👤 참여 캐릭터: <span style="color:${charColor}; font-weight:bold;">${selectedEvent.character}</span></div>
                <div>🏷️ 반복 유형: <b>${isFixed ? '🛡️ 매주 고정 파티' : '⚡ 이번 주만 일회성'}</b></div>
                ${selectedEvent.channel ? `<div>📍 채널: <b>${selectedEvent.channel}</b></div>` : ''}
                ${selectedEvent.memo ? `<div>📝 메모: <b>${selectedEvent.memo}</b></div>` : ''}
            `;
            detailButtonsEl.innerHTML = `
                <button onclick="openScheduleModal(${selectedEvent.day}, null, ${selectedEvent.id})" style="background:#2563eb; color:white; font-size:12px; padding:6px 14px;">수정</button>
                <button onclick="deleteBossSchedule(${selectedEvent.id}, event)" style="background:#ef4444; color:white; font-size:12px; padding:6px 14px;">삭제</button>
            `;
            bottomDetailsEl.classList.add('active');
        } else {
            bottomDetailsEl.classList.remove('active');
        }
    } else {
        bottomDetailsEl.classList.remove('active');
    }
}

/* 📅 자산 스케줄러 로직 */
function getCalendarRecords() { return JSON.parse(localStorage.getItem('maple_calendar_records_v8') || '[]'); }
function saveCalendarRecords(list) { localStorage.setItem('maple_calendar_records_v8', JSON.stringify(list)); }

function changeMonth(direction) {
    currentDate.setMonth(currentDate.getMonth() + direction);
    activePopupDate = null;
    renderCalendar();
}

function getAllUniqueItemNames() {
    const records = getCalendarRecords();
    let names = [...new Set(records.map(r => r.name))];
    if (names.length === 0) names = ['솔 에르다 조각', '메소'];
    return names;
}

function toggleDatePopup(dateStr, event) {
    if(event) event.stopPropagation();
    activePopupDate = (activePopupDate === dateStr) ? null : dateStr;
    renderCalendar();
}

function closePopup(event) {
    if(event) event.stopPropagation();
    activePopupDate = null;
    renderCalendar();
}

function setPopupPreset(name) {
    const inputName = document.getElementById(`popupName_${activePopupDate}`);
    if (inputName) {
        inputName.value = name;

    }

function addRecordFromPopup(dateStr, event) {
    if(event) event.stopPropagation();
    const nameInput = document.getElementById(`popupName_${dateStr}`);
    const valInput = document.getElementById(`popupVal_${dateStr}`);

    const name = nameInput.value.trim();
    const value = parseFloat(valInput.value);

    if (!name) return alert('아이템명 또는 자산명을 입력해주세요!');
    if (isNaN(value)) return alert('올바른 숫자를 입력해주세요!');

    let records = getCalendarRecords();
    records.push({ id: Date.now(), date: dateStr, name, value });
    saveCalendarRecords(records);
    renderCalendar();
    
    setTimeout(() => {
        activePopupDate = dateStr;
        renderCalendar();
        document.getElementById(`popupName_${dateStr}`).focus();
    }, 10);
}

function deleteCalendarRecord(id, event) {
    if(event) event.stopPropagation();
    let records = getCalendarRecords().filter(r => r.id !== id);
    saveCalendarRecords(records);
    renderCalendar();
}

function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('calendarTitle').textContent = `${year}년 ${month + 1}월`;

    const firstDayIndex = new Date(year, month, 1).getDay();
    const lastDay = new Date(year, month + 1, 0).getDate();

    const gridContainer = document.getElementById('calendarDaysGrid');
    let html = '';

    for (let i = 0; i < firstDayIndex; i++) html += `<div class="calendar-cell empty"></div>`;

    const records = getCalendarRecords();
    const uniqueNames = getAllUniqueItemNames();
    const todayDateStr = new Date().toISOString().split('T')[0];

    for (let day = 1; day <= lastDay; day++) {
        const mm = String(month + 1).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        const dateStr = `${year}-${mm}-${dd}`;

        const dayRecords = records.filter(r => r.date === dateStr);
        const isToday = (dateStr === todayDateStr);
        
        let badgesHtml = '';
        dayRecords.forEach(r => {
            const theme = getItemColor(r.name);
            badgesHtml += `
            <div class="cell-badge" style="background:${theme.bg}; color:${theme.color};">
                <span>${r.name}: <b>${r.value.toLocaleString()}</b></span>
                <button onclick="deleteCalendarRecord(${r.id}, event)" title="삭제">✖</button>
            </div>
            `;
        });

        const isSelected = activePopupDate === dateStr ? 'selected' : '';
        const todayClass = isToday ? 'today-cell' : '';

        let popupHtml = '';
        if (activePopupDate === dateStr) {
            let chipsHtml = uniqueNames.map(name => `<button class="popup-chip" onclick="setPopupPreset('${name}')">+ ${name}</button>`).join('');
            popupHtml = `
            <div class="day-popup-box active" style="top: 10px; left: 105%;" onclick="event.stopPropagation()">
                <div class="popup-header">
                    <span>📅 ${dateStr} 등록</span>
                    <button onclick="closePopup(event)" style="background:transparent; border:none; color:white; font-size:12px; cursor:pointer;">✖</button>
                </div>
                <div class="popup-chips">${chipsHtml}</div>
                <div class="popup-form">
                    <input type="text" id="popupName_${dateStr}" placeholder="항목 이름" onkeypress="if(event.key==='Enter') document.getElementById('popupVal_${dateStr}').focus()">
                    <input type="number" id="popupVal_${dateStr}" placeholder="수치" value="1" onfocus="this.select()" onkeypress="if(event.key==='Enter') addRecordFromPopup('${dateStr}', event)">
                    <button onclick="addRecordFromPopup('${dateStr}', event)" style="background:#10b981; color:#0f172a; padding:8px; font-size:13px;">➕ 추가하기</button>
                </div>
            </div>
            `;
        }

        html += `
        <div class="calendar-cell ${isSelected} ${todayClass}" onclick="toggleDatePopup('${dateStr}', event)">
            <div class="cell-header">
                <div class="cell-date">${day} ${isToday ? '<span class="today-badge-text">오늘</span>' : ''}</div>
                ${dayRecords.length > 0 ? `<span style="font-size:10px; color:var(--accent-color); font-weight:bold;">${dayRecords.length}건</span>` : ''}
            </div>
            <div class="cell-content">${badgesHtml}</div>
            ${popupHtml}
        </div>
        `;
    }

    gridContainer.innerHTML = html;
    renderStatsSummary(year, month + 1, records);
}

function renderStatsSummary(year, month, records) {
    const summaryGrid = document.getElementById('statsSummaryGrid');
    const mmStr = String(month).padStart(2, '0');
    const monthRecords = records.filter(r => r.date.startsWith(`${year}-${mmStr}`));
    const monthItemNames = [...new Set(monthRecords.map(r => r.name))];

    if (monthItemNames.length === 0) {
        summaryGrid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:var(--text-muted); font-size:13px; padding:10px;">이번 달(${month}월) 기록된 자산/아이템 데이터가 없습니다.</div>`;
        return;
    }

    summaryGrid.innerHTML = monthItemNames.map(name => {
        const itemMonthSum = monthRecords.filter(r => r.name === name).reduce((acc, cur) => acc + cur.value, 0);
        const totalSum = records.filter(r => r.name === name).reduce((acc, cur) => acc + cur.value, 0);
        const theme = getItemColor(name);

        return `
        <div class="stat-card" style="border-left: 4px solid ${theme.color};">
            <div class="stat-card-title">📦 ${name}</div>
            <div style="font-size: 14px; color: var(--text-color); margin-bottom: 4px; font-weight:bold;">
                이번 달(${month}월) 누적: <span style="color:${theme.color};">${itemMonthSum.toLocaleString()}</span>
            </div>
            <div style="font-size: 12px; color: var(--text-muted);">
                전체 누적 합계: <span style="color:white;">${totalSum.toLocaleString()}</span>
            </div>
        </div>
        `;
    }).join('');
}

function getSavedList() { return JSON.parse(localStorage.getItem('maple_friends_list_v28') || '[]'); }
function saveList(list) { localStorage.setItem('maple_friends_list_v28', JSON.stringify(list)); }
function getSavedGroups() { return JSON.parse(localStorage.getItem('maple_custom_groups_v22') || '["친구"]'); }
function saveGroups(groups) { localStorage.setItem('maple_custom_groups_v22', JSON.stringify(groups)); }

function updateGroupDropdown(keepSelectedVal = null) {
    const select = document.getElementById('groupSelect');
    if (!select) return;
    const currentVal = keepSelectedVal !== null ? keepSelectedVal : select.value;
    const groups = getSavedGroups();
    select.innerHTML = groups.map(g => `<option value="${g}">${g}</option>`).join('');
    if (currentVal && groups.includes(currentVal)) select.value = currentVal;
    else if (groups.length > 0) select.value = groups[0];
}

function createNewGroup() {
    const inputName = prompt('새로 만들 그룹 이름을 입력하세요 (예: 본캐라인, 스트리머, 길드원):');
    if (inputName && inputName.trim()) {
        const newName = inputName.trim();
        const groups = getSavedGroups();
        if (!groups.includes(newName)) {
            groups.push(newName);
            saveGroups(groups);
        }
        updateGroupDropdown(newName);
        renderGroupTabs();
    }
}

function renderGroupTabs() {
    const tabsContainer = document.getElementById('groupTabs');
    if (!tabsContainer) return;
    const groups = ['전체', ...getSavedGroups()];
    tabsContainer.innerHTML = groups.map(g => `
        <button class="tab-btn ${currentTab === g ? 'active' : ''}" onclick="switchTab('${g}')">${g}</button>
    `).join('');
}

function switchTab(groupName) {
    currentTab = groupName;
    renderGroupTabs();
    renderSavedCards();
}

function checkIsBossSpec(equipmentData) {
    if (!equipmentData || !equipmentData.item_equipment) return false;
    let starforceSum = 0, equippedCount = 0;
    equipmentData.item_equipment.forEach(item => {
        if (item.starforce) starforceSum += parseInt(item.starforce, 10) || 0;
        equippedCount++;
    });
    return starforceSum >= 100 || equippedCount >= 10;
}

        `한 걸음 한 걸음 정성껏 내딛는 발걸음! 지난 7일간 경험치 +${totalExpChange.toFixed(3)}% 상승으로 앞으로가 더욱 기대되는 캐릭터예요.`
    ];
    return { statusType: "monthly", badgeText: "🌱 새싹 발자국", tag: "🌱 [모래성에 새겨진 소중한 새싹 발자국]", desc: sproutPool[Math.floor(Math.random() * sproutPool.length)] };
}

async function fetchSingleCharacterData(charItem) {
    const name = charItem.name;
    try {
        const idData = await fetchApi(`https://open.api.nexon.com/maplestory/v1/id?character_name=${encodeURIComponent(name)}`);
        if (!idData || !idData.ocid) return charItem;
        const ocid = idData.ocid;
        const pastStr = getDateStr(7);

        const [todayData, pastData, unionData, equipmentData] = await Promise.all([
            fetchApi(`https://open.api.nexon.com/maplestory/v1/character/basic?ocid=${ocid}`),
            fetchApi(`https://open.api.nexon.com/maplestory/v1/character/basic?ocid=${ocid}&date=${pastStr}`),
            fetchApi(`https://open.api.nexon.com/maplestory/v1/user/union?ocid=${ocid}`),
            fetchApi(`https://open.api.nexon.com/maplestory/v1/character/item-equipment?ocid=${ocid}`)
        ]);

        if (!todayData) return charItem;

        const level = todayData.character_level;
        const unionLevel = unionData ? unionData.union_level : '정보 없음';
        const lvlDiff = pastData ? (level - pastData.character_level) : 0;
        const todayExp = parseFloat(todayData.character_exp_rate || 0);
        const pastExp = pastData ? parseFloat(pastData.character_exp_rate || 0) : 0;
        const totalExpChange = pastData ? ((lvlDiff * 100) + (todayExp - pastExp)) : 0;
        const diagnosis = generateUniqueDiagnosis(level, lvlDiff, totalExpChange, level >= 300, checkIsBossSpec(equipmentData));

        return {
            name: todayData.character_name,
            world: todayData.world_name,
            className: todayData.character_class,
            level: todayData.character_level,
            expRate: todayData.character_exp_rate,
            image: todayData.character_image,
            union: unionLevel,
            group: charItem.group,
            statusType: diagnosis.statusType,
            badgeText: diagnosis.badgeText,
            category: diagnosis.tag,
            desc: diagnosis.desc,
            updatedAt: new Date().toLocaleTimeString()
        };
    } catch (e) {
        return charItem;
    }
}

async function fetchAllCharactersData(isManual = false) {
    const list = getSavedList();
    if (list.length === 0) {
        if (isManual) alert('갱신할 등록 캐릭터가 없습니다.');
        return;
    }
    const loading = document.getElementById('loading');
    if (isManual) {
        loading.textContent = '🔄 전체 캐릭터 최신 데이터 일괄 갱신 중...';
        loading.style.display = 'block';
    }
    const updatedList = await Promise.all(list.map(char => fetchSingleCharacterData(char)));
    saveList(updatedList);
    renderSavedCards();
    if (isManual) {
        loading.style.display = 'none';
        loading.textContent = '캐릭터 데이터를 분석하여 진단 문장을 생성하는 중...';
    }
}

async function manualRefreshAllCharacters() {
    const btn = document.getElementById('btnRefreshAll');
    if (btn.disabled) return;
    btn.disabled = true;
    await fetchAllCharactersData(true);
    let secondsLeft = 10;
    btn.textContent = `⏳ 쿨타임 (${secondsLeft}초)`;
    const timer = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) btn.textContent = `⏳ 쿨타임 (${secondsLeft}초)`;
        else {
            clearInterval(timer);
            btn.disabled = false;
            btn.textContent = '🔄 전체 갱신';
        }
    }, 1000);
}

async function addOrUpdateCharacter(targetName = null) {
    const nameInput = document.getElementById('charName');
    const name = targetName || nameInput.value.trim();
    const groupSelect = document.getElementById('groupSelect');
    const selectedGroup = groupSelect.value;
    
    if (!name) return alert('캐릭터 닉네임을 입력해주세요!');
    if (!selectedGroup) return alert('먼저 [+ 그룹 생성] 버튼을 눌러 그룹을 만들어주세요!');

    const loading = document.getElementById('loading');
    loading.style.display = 'block';

    try {
        const existingList = getSavedList();
        const existingItem = existingList.find(i => i.name === name) || { name, group: selectedGroup };
        const updatedChar = await fetchSingleCharacterData(existingItem);
        if (!updatedChar.world) throw new Error(`'${name}' 캐릭터를 찾을 수 없습니다.`);

        let list = getSavedList().filter(item => item.name !== updatedChar.name);
        list.unshift(updatedChar);
        saveList(list);

        renderGroupTabs();
        renderSavedCards();
        if (!targetName) nameInput.value = '';
        loading.style.display = 'none';
    } catch (err) {
        alert(err.message);
        loading.style.display = 'none';
    }
}

function updateCharacterGroup(name, newGroup) {
    let list = getSavedList();
    const target = list.find(item => item.name === name);
    if (target) {
        target.group = newGroup;
        saveList(list);
        renderSavedCards();
    }
}

function renderSavedCards() {
    const container = document.getElementById('cardContainer');
    if (!container) return;
    let list = getSavedList();
    const groups = getSavedGroups();

    if (currentTab !== '전체') list = list.filter(char => char.group === currentTab);

    if (list.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 30px;">등록된 캐릭터가 없습니다. 상단에서 닉네임을 검색해 추가해보세요!</div>`;
        return;
    }

    container.innerHTML = list.map(char => {
        let groupOptions = groups.map(g => `<option value="${g}" ${char.group === g ? 'selected' : ''}>${g}</option>`).join('');
        let badgeClass = 'badge-active';
        if (char.statusType === 'psycho') badgeClass = 'badge-psycho';
        else if (char.statusType === 'hardcore') badgeClass = 'badge-hardcore';
        else if (char.statusType === 'step85') badgeClass = 'badge-step85';
        else if (char.statusType === 'step75') badgeClass = 'badge-step75';
        else if (char.statusType === 'step65') badgeClass = 'badge-step65';
        else if (char.statusType === 'step50') badgeClass = 'badge-step50';
        else if (char.statusType === 'step35') badgeClass = 'badge-step35';
        else if (char.statusType === 'step30') badgeClass = 'badge-step30';
        else if (char.statusType === 'monthly') badgeClass = 'badge-monthly';
        else if (char.statusType === 'boss') badgeClass = 'badge-boss';
        else if (char.statusType === 'inactive') badgeClass = 'badge-inactive';

        return `
        <div class="card">
            <button class="btn-delete-top" onclick="removeCharacter('${char.name}')">삭제</button>
            <div class="profile-header">
                <div class="char-img"><img src="${char.image}" alt="캐릭터"></div>
                <div style="flex:1;">
                    <div style="font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                        ${char.name}
                        <select class="group-select-inline" onchange="updateCharacterGroup('${char.name}', this.value)">${groupOptions}</select>
                    </div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">${char.world} / ${char.className}</div>
                    <div style="font-size: 14px; margin-top: 5px; font-weight: bold;">
                        Lv.${char.level} <span style="font-size:12px; color:var(--text-muted);">(${char.expRate}%)</span>
                    </div>
                    <div style="font-size: 12px; color: #38bdf8; margin-top: 2px; font-weight: bold;">🛡️ 유니온: ${char.union}</div>
                    <div><span class="badge ${badgeClass}">${char.badgeText || '🔥 활발히 플레이 중!'}</span></div>
                </div>
            </div>
            <div class="summary-box">
                <div><span class="category-tag">${char.category}</span></div>
                <div class="summary-content">📌 <b>상태 진단:</b> ${char.desc}</div>
                <div class="summary-footer">
                    <span>갱신: ${char.updatedAt || '방금 전'}</span>
                </div>
            </div>
        </div>
        `;
    }).join('');
}

function removeCharacter(name) {
    if (!confirm(`'${name}' 캐릭터를 목록에서 삭제하시겠습니까?`)) return;
    saveList(getSavedList().filter(item => item.name !== name));
    renderSavedCards();
}

function updateGroupDropdown(keepSelectedVal = null) {
    const select = document.getElementById('groupSelect');
    if (!select) return;
    const currentVal = keepSelectedVal !== null ? keepSelectedVal : select.value;
    const groups = getSavedGroups();
    select.innerHTML = groups.map(g => `<option value="${g}">${g}</option>`).join('');
    if (currentVal && groups.includes(currentVal)) select.value = currentVal;
    else if (groups.length > 0) select.value = groups[0];
}

function renderGroupTabs() {
    const tabsContainer = document.getElementById('groupTabs');
    if (!tabsContainer) return;
    const groups = ['전체', ...getSavedGroups()];
    tabsContainer.innerHTML = groups.map(g => `
        <button class="tab-btn ${currentTab === g ? 'active' : ''}" onclick="switchTab('${g}')">${g}</button>
    `).join('');
}

function switchTab(groupName) {
    currentTab = groupName;
    renderGroupTabs();
    renderSavedCards();
}
</script>
